<svg xmlns="http://www.w3.org/2000/svg" width="960" height="150" viewBox="0 0 960 150">
<title>HabitFlow</title><defs>
 <linearGradient id="ink" x2="1" y2="1"><stop stop-color="#071412"/><stop offset=".49" stop-color="#0a201a"/><stop offset="1" stop-color="#12382b"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#58eaa3" stop-opacity=".32"/><stop offset=".55" stop-color="#30b980" stop-opacity=".18"/><stop offset="1" stop-color="#2c9a60" stop-opacity="0"/></radialGradient>
 <linearGradient id="metal" x2="0" y2="1"><stop stop-color="#fff2b6"/><stop offset=".31" stop-color="#e9c36f"/><stop offset=".67" stop-color="#96723b"/><stop offset="1" stop-color="#f5d693"/></linearGradient>
 <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#b1edce" stroke-opacity=".09"/></pattern>
 <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
@keyframes orbit {to {transform:rotate(360deg)}}
@keyframes stream {to {stroke-dashoffset:-240}}
@keyframes breathe {0%,100% {opacity:.38} 50% {opacity:1}}
.orbit {animation:orbit 28s linear infinite}
.stream {animation:stream 8s linear infinite}
.pulse {animation:breathe 4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce) {.orbit,.stream,.pulse {animation:none}}
</style>
<rect width="960" height="150" rx="15" fill="url(#ink)"/>
<rect x="1" y="1" width="958" height="148" rx="14" fill="url(#grid)" stroke="#779484" stroke-opacity=".55"/><ellipse cx="779" cy="77" rx="175" ry="73" fill="url(#aura)"/>
<path d="M24 125h908M620 20v104" stroke="#e7c479" opacity=".24"/>
<text x="34" y="56" fill="#e7c479" font-family="monospace" letter-spacing="2.1" font-size="19">HABIT TRACKING</text>
<text x="32" y="105" fill="#fff4d2" font-family="Georgia, serif" font-weight="bold" font-size="44">HabitFlow</text>
<g fill="none" stroke-linejoin="round" stroke-linecap="round"><path d="M671 115h220M671 88h220M671 61h220M671 34h220" stroke="#a9f2c4" opacity=".22"/>
<path d="M674 103h28V83h38V62h39V82h40V57h41V39h26" stroke="#a9f2c4" opacity=".66" stroke-width="2"/>
<path d="M674 103h28V83h38V62h39V82h40V57h41V39h26" stroke="#fff4d2" stroke-width="3" stroke-dasharray="30 90" class="stream" filter="url(#glow)"/></g></svg>